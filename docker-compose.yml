services:
  backend:
    build: ./backend
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: h2
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5177:5177"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
